<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="查驗照片">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>查驗照片上傳</title>
<style>
  :root { --main:#1f5fa8; --main-d:#17487f; --bg:#f1f4f8; --card:#fff; --text:#1c2733; --sub:#5d6b7a; --line:#d5dce5; --ok:#1e8a4c; --warn:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.5 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
  header { background:var(--main); color:#fff; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top)); display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:20px; margin:0; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px; padding:8px 12px; font-size:15px; }
  main { max-width:560px; margin:0 auto; padding:16px; padding-bottom:80px; }
  .step { margin-bottom:14px; }
  .step-btn { width:100%; display:flex; align-items:center; gap:12px; text-align:left; background:var(--main); color:#fff; border:0; border-radius:14px; padding:18px 16px; font-size:19px; font-weight:600; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .step-btn:active { background:var(--main-d); }
  .step-btn .no { flex:none; width:36px; height:36px; border-radius:50%; background:#fff; color:var(--main); display:grid; place-items:center; font-size:19px; }
  .step-btn .state { margin-left:auto; font-size:13px; font-weight:400; opacity:.9; text-align:right; max-width:45%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .panel { display:none; background:var(--card); border:1px solid var(--line); border-radius:0 0 14px 14px; margin:-10px 0 0; padding:22px 14px 14px; }
  .step.open .panel { display:block; }
  label { display:block; font-size:14px; color:var(--sub); margin:10px 0 4px; }
  input[type=text], input[type=password], input[type=url], select { width:100%; font-size:17px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--text); }
  .btn { display:block; width:100%; margin-top:12px; padding:13px; font-size:17px; font-weight:600; border-radius:10px; border:1px solid var(--main); background:var(--main); color:#fff; }
  .btn.light { background:#fff; color:var(--main); }
  .btn.danger { background:#fff; color:var(--warn); border-color:var(--warn); }
  .btn:disabled { opacity:.45; }
  .row { display:flex; gap:8px; }
  .row .btn { margin-top:12px; }
  .hint { font-size:14px; color:var(--sub); margin:8px 0 0; }
  .ok { color:var(--ok); } .warn { color:var(--warn); }
  .list { margin-top:10px; }
  .item { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .item img { width:72px; height:72px; object-fit:cover; border-radius:8px; flex:none; background:#ddd; }
  .item .info { flex:1; min-width:0; font-size:14px; }
  .item .info b { display:block; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item button { flex:none; border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 10px; font-size:14px; color:var(--warn); }
  .item input { margin-top:4px; padding:7px 9px; font-size:15px; }
  .check { display:flex; gap:10px; align-items:flex-start; margin-top:14px; font-size:16px; color:var(--text); }
  .check input { width:22px; height:22px; margin-top:2px; flex:none; }
  #toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#222c; color:#fff; padding:10px 16px; border-radius:20px; font-size:15px; max-width:90%; display:none; z-index:9; }
  #cam { position:fixed; inset:0; background:#000; z-index:8; display:flex; flex-direction:column; }
  #cam[hidden] { display:none; }
  #camVideo { flex:1; min-height:0; width:100%; object-fit:contain; transition:opacity .1s; }
  #camInfo { position:absolute; top:calc(12px + env(safe-area-inset-top)); left:0; right:0; text-align:center; color:#fff; font-size:15px; text-shadow:0 1px 3px #000; }
  #camBar { flex:none; display:flex; align-items:center; justify-content:space-between; padding:16px 24px calc(20px + env(safe-area-inset-bottom)); }
  #camClose { width:72px; padding:10px 0; font-size:16px; color:#fff; background:#fff3; border:0; border-radius:10px; }
  #camShot { width:74px; height:74px; border-radius:50%; border:5px solid #fff; background:#fff8; }
  #camShot:active { background:#fff; }
  dialog { border:0; border-radius:14px; padding:18px; width:min(92vw,480px); }
  dialog::backdrop { background:#0007; }
  dialog h2 { margin:0 0 8px; font-size:19px; }
  ul.plain { padding-left:20px; margin:8px 0; font-size:15px; }
</style>
</head>
<body>
<header>
  <h1>查驗照片上傳</h1>
  <button id="btnSettings">設定</button>
</header>

<main>
  <!-- 1 建立資料夾 -->
  <section class="step" id="s1">
    <button class="step-btn" data-step="s1"><span class="no">1</span>建立資料夾<span class="state" id="st1"></span></button>
    <div class="panel">
      <label for="folderName">資料夾名稱（不填就用現在的月日時）</label>
      <input type="text" id="folderName" autocomplete="off">
      <button class="btn" id="btnCreate">建立雲端資料夾</button>
      <div id="renameBox" hidden>
        <label for="renameName">修改目前資料夾的名稱</label>
        <input type="text" id="renameName" autocomplete="off">
        <button class="btn light" id="btnRename">儲存新名稱</button>
      </div>
    </div>
  </section>

  <!-- 2 權限 -->
  <section class="step" id="s2">
    <button class="step-btn" data-step="s2"><span class="no">2</span>同意權限・開啟自動上傳<span class="state" id="st2"></span></button>
    <div class="panel">
      <p style="margin:0">按下同意後，手機會詢問是否允許使用<b>相機</b>，請選「允許」。之後你在這個 App 拍的照片會：</p>
      <ul class="plain">
        <li>先暫存在手機裡，<b>滿 24 小時才自動上傳</b>到雲端。</li>
        <li>24 小時內可以隨時刪掉不要的照片。</li>
        <li>自動上傳會在你<b>打開 App 時</b>進行（手機系統不允許網頁 App 在關閉時背景上傳）。</li>
      </ul>
      <button class="btn" id="btnConsent">我同意，開啟自動上傳</button>
      <button class="btn danger" id="btnRevoke" hidden>關閉自動上傳</button>
      <p class="hint" id="consentInfo"></p>
    </div>
  </section>

  <!-- 3 選資料夾 + 拍照 -->
  <section class="step" id="s3">
    <button class="step-btn" data-step="s3"><span class="no">3</span>選擇上傳資料夾・拍照<span class="state" id="st3"></span></button>
    <div class="panel">
      <label for="folderSelect">照片要上傳到哪個資料夾</label>
      <div class="row">
        <select id="folderSelect"></select>
        <button class="btn light" id="btnReload" style="width:auto;margin-top:0;white-space:nowrap">重新整理</button>
      </div>
      <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
      <input type="file" id="pickInput" accept="image/*" multiple hidden>
      <div class="row">
        <button class="btn" id="btnCam">拍照</button>
        <button class="btn light" id="btnPick">從相簿選</button>
      </div>
      <p class="hint" id="queueInfo"></p>
      <div class="list" id="queue"></div>
      <button class="btn light" id="btnUploadNow" hidden>不等 24 小時，全部立即上傳</button>
    </div>
  </section>

  <!-- 4 生成查驗單 -->
  <section class="step" id="s4">
    <button class="step-btn" data-step="s4"><span class="no">4</span>生成查驗單<span class="state" id="st4"></span></button>
    <div class="panel">
      <p class="hint" style="margin-top:0">使用資料夾：<b id="genFolder">（尚未選擇）</b></p>
      <label for="fProject">名稱（工程名稱）</label><input type="text" id="fProject">
      <label for="fItem">工程項目</label><input type="text" id="fItem">
      <label for="fContractor">承包廠商</label><input type="text" id="fContractor">
      <label for="fDate">查驗日期</label><input type="text" id="fDate">
      <label for="fFormNo">表單編號</label><input type="text" id="fFormNo">
      <label for="fCompany">公司名稱（表頭）</label><input type="text" id="fCompany">
      <button class="btn light" id="btnLoadPhotos">載入雲端資料夾的照片</button>
      <p class="hint" id="genInfo"></p>
      <div class="list" id="genList"></div>
      <label class="check"><input type="checkbox" id="chkReviewed"><span>我已檢核以上「名稱、工程項目、承包廠商、查驗日期」內容正確</span></label>
      <button class="btn" id="btnGenerate" disabled>生成查驗單（Word + Excel）</button>
      <div id="genResult"></div>
    </div>
  </section>
</main>

<dialog id="dlgSettings">
  <h2>設定</h2>
  <label for="setUrl">雲端服務網址（Apps Script 網頁應用程式網址）</label>
  <input type="url" id="setUrl" placeholder="https://script.google.com/macros/s/…/exec">
  <label for="setKey">通關密碼</label>
  <input type="password" id="setKey" autocomplete="off">
  <button class="btn" id="btnSaveSettings">儲存並測試連線</button>
  <button class="btn light" id="btnCloseSettings">關閉</button>
  <p class="hint" id="setInfo"></p>
</dialog>

<div id="cam" hidden>
  <video id="camVideo" playsinline autoplay muted></video>
  <div id="camInfo"></div>
  <div id="camBar">
    <button id="camClose">完成</button>
    <button id="camShot" aria-label="拍照"></button>
    <span style="width:72px"></span>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="generate.js"></script>
<script src="app.js"></script>
</body>
</html>
